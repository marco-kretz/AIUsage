name: Release

# A pushed tag v* (also one created with a release in the GitHub UI) builds the app
# and attaches the zip to the release of that tag, creating the release if needed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test

      - name: Publish
        shell: pwsh
        run: |
          # VS 18 vcvarsall.bat calls vswhere without a path; the AOT linker step needs it on PATH.
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/AIUsage.App -c Release -r win-x64 -o artifacts/publish -p:Version=$version
          Get-ChildItem artifacts/publish -Exclude *.pdb | Compress-Archive -DestinationPath "artifacts/AIUsage-$version-win-x64.zip"

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --generate-notes }
          gh release upload $tag (Get-ChildItem artifacts/*.zip) --clobber
